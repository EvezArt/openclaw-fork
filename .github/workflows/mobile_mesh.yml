name: EVEZ mobile mesh

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile_mesh.yml"
  push:
    branches:
      - main
      - "evez-mobile-audio-mesh/**"

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned dependencies
        run: python3 -m pip install --require-hashes -r mobile/linux/requirements.txt

      - name: Compile relay
        run: python3 -m py_compile mobile/linux/evez_mobile_relay.py

      - name: Validate schema
        run: python3 -m json.tool mobile/protocol/mobile_observation.schema.json >/dev/null

      - name: Shell syntax
        run: |
          bash -n mobile/termux/install.sh
          bash -n mobile/termux/evezctl
          bash -n mobile/termux/evez-mobile-daemon.sh
          bash -n mobile/termux/service/evez-mobile/run

      - name: Relay unit test
        run: python3 mobile/tests/test_relay.py

      - name: Mobile CLI mesh test
        run: python3 mobile/tests/test_mobile_cli.py

      - name: Relay smoke
        run: |
          python3 mobile/linux/evez_mobile_relay.py &
          PID=$!
          trap "kill $PID" EXIT
          python3 - <<'PY'
import json
import time
import urllib.error
import urllib.request

url = "http://127.0.0.1:8788/health"
last_error = None
body = None
for _ in range(50):
    try:
        with urllib.request.urlopen(url, timeout=1) as response:
            body = json.loads(response.read())
        break
    except (OSError, urllib.error.URLError) as exc:
        last_error = exc
        time.sleep(0.1)

if body is None:
    raise SystemExit(f"relay did not become ready within 5 seconds: {last_error}")

assert body["ok"] is True
assert body["service"] == "evez-mobile-relay"
assert body["write_auth_configured"] is False
print("relay: PASS")
PY
